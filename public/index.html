<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#f6f4fd">
  <title>Margin</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9.5 4v16"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></symbol>
      <symbol id="i-tag" viewBox="0 0 24 24"><path d="M3 12.2V4a1 1 0 0 1 1-1h8.2a2 2 0 0 1 1.4.6l7.2 7.2a2 2 0 0 1 0 2.8l-7.6 7.6a2 2 0 0 1-2.8 0l-7.2-7.2A2 2 0 0 1 3 12.2z"/><circle cx="7.5" cy="7.5" r="1.2"/></symbol>
      <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 3h11.2a2 2 0 0 1 1.4.6l2.8 2.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M7 3v5a1 1 0 0 0 1 1h7a1 1 0 0 0 1-1V3"/><path d="M7 21v-6a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v6"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4.5A1.5 1.5 0 0 1 9.5 3h5A1.5 1.5 0 0 1 16 4.5V6"/><path d="M18.5 6l-.8 13.1a2 2 0 0 1-2 1.9H8.3a2 2 0 0 1-2-1.9L5.5 6"/><path d="M10 11v5.5M14 11v5.5"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-code" viewBox="0 0 24 24"><path d="m8 6-6 6 6 6M16 6l6 6-6 6"/></symbol>
      <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></symbol>
      <symbol id="i-restore" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8.2"/><path d="M3 3v5.2h5.2"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 18l-6-6 6-6"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
      <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3.2-3.2a4 4 0 0 0-5.7-5.7l-1.1 1.1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3.2 3.2a4 4 0 0 0 5.7 5.7l1.1-1.1"/></symbol>
    </defs>
  </svg>

  <div id="app">
    <aside id="sidebar">
      <div class="sb-head">
        <a id="home" class="brand" href="/" title="Home"><img src="/favicon.svg" alt=""><span>Margin</span></a>
        <button id="sb-collapse" class="icon-btn" title="Hide sidebar" aria-label="Hide sidebar"><svg class="when-wide"><use href="#i-panel"/></svg><svg class="when-narrow"><use href="#i-close"/></svg></button>
      </div>
      <button id="new-note" class="btn btn-primary btn-block" title="New note"><svg><use href="#i-plus"/></svg> New note</button>
      <div class="sb-filters">
        <label class="field">
          <svg><use href="#i-tag"/></svg>
          <select id="tag-filter" aria-label="Filter by tag"></select>
        </label>
        <label class="field">
          <svg><use href="#i-search"/></svg>
          <input id="search" type="search" placeholder="Search notes" autocomplete="off" spellcheck="false">
        </label>
      </div>
      <div id="trash-head" class="trash-head" hidden>
        <span><svg><use href="#i-trash"/></svg> Trash</span>
        <button id="empty-trash" class="btn btn-danger btn-small">Empty trash</button>
      </div>
      <ul id="note-list" class="note-list"></ul>
      <div class="sb-foot">
        <button id="trash-toggle" class="btn btn-ghost btn-small"><svg><use href="#i-trash"/></svg> <span>Trash</span></button>
        <span class="sb-user">
          <span id="avatar" class="avatar"></span>
          <span id="username"></span>
          <button id="logout" class="icon-btn" title="Log out" aria-label="Log out"><svg><use href="#i-logout"/></svg></button>
        </span>
      </div>
    </aside>

    <main id="main">
      <div id="menubar" class="menubar">
        <button id="sb-expand" class="icon-btn" title="Show sidebar" aria-label="Show sidebar" hidden><svg class="when-wide"><use href="#i-panel"/></svg><svg class="when-narrow"><use href="#i-menu"/></svg></button>
        <div id="note-tools" class="note-tools" hidden>
          <div class="toolgroup">
            <button id="save" class="tool save-btn" data-state="clean" title="Saved (Ctrl+S)" aria-label="Save"><svg><use href="#i-save"/></svg><span class="save-dot"></span></button>
            <button id="mode-toggle" class="mode-switch" data-mode="render" title="Render mode · click for raw (Ctrl+E)" aria-label="Toggle render and raw mode">
              <span class="ms-thumb"></span>
              <svg class="ms-render"><use href="#i-eye"/></svg>
              <svg class="ms-raw"><use href="#i-code"/></svg>
            </button>
            <button id="font-toggle" class="mode-switch font-switch" data-font="mono" title="Monospace font · click for proportional" aria-label="Toggle monospace and proportional font">
              <span class="ms-thumb"></span>
              <span class="fs-glyph fs-mono">Aa</span>
              <span class="fs-glyph fs-prop">Aa</span>
            </button>
            <button id="format-btn" class="tool format-btn" title="Formatting" aria-label="Formatting">
              <svg viewBox="0 0 24 24" class="palette">
                <path d="M12 3a9 9 0 1 0 0 18c1.2 0 2-.8 2-1.9 0-.5-.2-.9-.5-1.3-.3-.3-.5-.7-.5-1.2 0-1 .9-1.9 2-1.9h2.3c2.6 0 4.7-2.1 4.7-4.7C22 6 17.5 3 12 3z" class="palette-body"/>
                <circle cx="7" cy="12" r="1.6" style="fill:#ff7a8a;stroke:none"/>
                <circle cx="9" cy="7.5" r="1.6" style="fill:#ffb347;stroke:none"/>
                <circle cx="14" cy="6.5" r="1.6" style="fill:#53d8b1;stroke:none"/>
                <circle cx="18" cy="9.5" r="1.6" style="fill:#8f7bff;stroke:none"/>
              </svg>
            </button>
          </div>
          <div id="tags" class="tags">
            <span id="tag-chips" class="tag-chips"></span>
            <span class="tag-input-wrap">
              <input id="tag-input" class="tag-input" placeholder="+ tag" maxlength="40" autocomplete="off" spellcheck="false">
              <ul id="tag-suggest" class="tag-suggest" hidden></ul>
            </span>
          </div>
          <span class="spacer"></span>
          <button id="trash-note" class="tool tool-danger" title="Move to trash" aria-label="Move to trash"><svg><use href="#i-trash"/></svg></button>
        </div>
      </div>
      <div id="trash-banner" class="trash-banner" hidden>
        <svg><use href="#i-trash"/></svg>
        <span>This note is in the trash.</span>
        <button id="restore-note" class="btn btn-small"><svg><use href="#i-restore"/></svg> Restore</button>
        <button id="delete-note" class="btn btn-danger btn-small">Delete forever</button>
      </div>
      <div id="editor-wrap" class="editor-wrap" hidden>
        <div id="paper" class="paper">
          <div id="editor"></div>
        </div>
      </div>
      <div id="empty-state" class="empty-state">
        <div class="blobs" aria-hidden="true"><span></span><span></span><span></span></div>
        <h2>Pick a note, or start a fresh one</h2>
        <p>Highlight in 24 colors, fold sections, paste screenshots.</p>
        <button id="new-note-2" class="btn btn-primary"><svg><use href="#i-plus"/></svg> New note</button>
      </div>
    </main>
  </div>
  <div id="backdrop" class="backdrop"></div>
  <div id="toast" class="toast" hidden></div>
  <script type="module" src="/build/app.js"></script>
</body>
</html>
